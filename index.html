<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ===================== PRIMARY SEO ===================== -->
    <!--
      These are the English homepage's values, so `npm run dev` looks right.
      scripts/prerender.mjs rewrites the title, description, robots, canonical,
      <html lang>, og:locale and the social tags for every route from
      src/pages/pageMeta.ts, so that module is the source of truth for what ships.
    -->
    <title>Old South End Partnership | Housing in Toledo’s Old South End</title>
    <meta name="description" content="Ten Toledo organizations working together so Old South End neighbors can find, keep, and strengthen their homes. Meet the partners and see our progress." />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <link rel="canonical" href="https://www.oseptoledo.org/" />

    <!-- ===================== LANGUAGES ===================== -->
    <!--
      The same on both language versions: each page lists the full set,
      itself included. Removed from the noindex 404 page by the prerender.
    -->
    <link rel="alternate" hreflang="en" href="https://www.oseptoledo.org/" />
    <link rel="alternate" hreflang="es" href="https://www.oseptoledo.org/es" />
    <link rel="alternate" hreflang="x-default" href="https://www.oseptoledo.org/" />

    <!-- ===================== GEO / LOCAL SEO ===================== -->
    <meta name="geo.region" content="US-OH" />
    <meta name="geo.placename" content="Toledo, Ohio" />

    <!-- ===================== OPEN GRAPH ===================== -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Old South End Partnership" />
    <meta property="og:title" content="Old South End Partnership | Housing in Toledo’s Old South End" />
    <meta property="og:description" content="Ten Toledo organizations working together so Old South End neighbors can find, keep, and strengthen their homes. Meet the partners and see our progress." />
    <meta property="og:url" content="https://www.oseptoledo.org/" />
    <meta property="og:image" content="https://www.oseptoledo.org/images/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Colorful storefronts along Broadway in the Old South End" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_US" />

    <!-- ===================== TWITTER CARD ===================== -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Old South End Partnership | Housing in Toledo’s Old South End" />
    <meta name="twitter:description" content="Ten Toledo organizations working together so Old South End neighbors can find, keep, and strengthen their homes. Meet the partners and see our progress." />
    <meta name="twitter:image" content="https://www.oseptoledo.org/images/og-image.jpg" />
    <meta name="twitter:image:alt" content="Colorful storefronts along Broadway in the Old South End" />

    <!-- ===================== THEME / ICONS ===================== -->
    <meta name="theme-color" content="#FBF6EC" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
